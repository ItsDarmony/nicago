<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Go Nic</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/styles.css">
    <style>
        .page-translate-wrapper {
            opacity: 1;
            transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .page-translate-wrapper.fade-out {
            opacity: 0;
            transform: translateY(-15px);
        }
    </style>
</head>
<body>

    <div id="pageContent" class="page-translate-wrapper">
        <!-- Header Navigation -->
        <header class="smooth-entry delay-1">
            <div class="nav-container">
                <a href="../index.html" class="logo">GO<span>NIC</span></a>
                <ul class="nav-links">
                    <li><a href="descubrir.html" data-i18n="nav_discover">Descubrir</a></li>
                    <li><a href="index.html#hotels" data-i18n="nav_hotels">Hoteles</a></li>
                    <li><a href="#" data-i18n="nav_foros">Foros</a></li>
                    <li><a href="contacto.html" class="active" data-i18n="nav_contact">Contacto</a></li>
                    <!-- Botón de Tema -->
                    <li>
                        <button type="button" id="theme-toggle" class="nav-theme-btn" aria-label="Cambiar tema">
                            <span id="theme-icon" style="display: flex; align-items: center;">
                                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                                </svg>
                            </span>
                            <span id="theme-text">Oscuro</span>
                        </button>
                    </li>
                    <!-- Botón de Idioma -->
                    <li>
                        <button type="button" id="lang-toggle" class="nav-theme-btn" aria-label="Cambiar idioma">
                            <span id="lang-text">EN</span>
                        </button>
                    </li>
                    <li><a href="login.html" class="btn-signin" data-i18n="nav_signin">Iniciar sesión</a></li>
                </ul>
            </div>
        </header>

        <!-- Hero Title -->
        <section class="hero smooth-entry delay-2">
            <h1 data-i18n="contact_hero">Ponte en contacto con nosotros</h1>
        </section>

        <!-- Contact Form Section -->
        <section class="categories-section smooth-entry delay-3" style="display: flex; justify-content: center; align-items: center; width: 100%;">
            <div class="categories-container" style="max-width: 700px; width: 100%; margin: 0 auto; display: flex; justify-content: center;">
                <div class="promo-card" style="display: block; padding: 40px; width: 100%; box-sizing: border-box;">
                    <h2 style="margin-bottom: 15px; font-size: 1.8rem;" data-i18n="contact_title">¿Tienes alguna duda o sugerencia?</h2>
                    <p style="margin-bottom: 30px; opacity: 0.85;" data-i18n="contact_subtitle">Completa el siguiente formulario y nuestro equipo de soporte o guías turísticos locales te responderá a la brevedad posible.</p>
                    
                    <form action="#" method="POST" style="display: flex; flex-direction: column; gap: 20px;">
                        <div style="display: flex; flex-direction: column; gap: 8px; text-align: left;">
                            <label for="nombre" style="font-weight: 600; font-size: 0.95rem;" data-i18n="label_name">Nombre completo</label>
                            <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required style="padding: 12px 16px; border-radius: 8px; border: 1px solid var(--border-color, #ccc); background: var(--bg-input, #fff); color: inherit; font-family: 'Poppins', sans-serif;">
                        </div>

                        <div style="display: flex; flex-direction: column; gap: 8px; text-align: left;">
                            <label for="email" style="font-weight: 600; font-size: 0.95rem;" data-i18n="label_email">Correo electrónico</label>
                            <input type="email" id="email" name="email" placeholder="tucorreo@ejemplo.com" required style="padding: 12px 16px; border-radius: 8px; border: 1px solid var(--border-color, #ccc); background: var(--bg-input, #fff); color: inherit; font-family: 'Poppins', sans-serif;">
                        </div>

                        <div style="display: flex; flex-direction: column; gap: 8px; text-align: left;">
                            <label for="asunto" style="font-weight: 600; font-size: 0.95rem;" data-i18n="label_subject">Asunto</label>
                            <input type="text" id="asunto" name="asunto" placeholder="Motivo de tu mensaje" required style="padding: 12px 16px; border-radius: 8px; border: 1px solid var(--border-color, #ccc); background: var(--bg-input, #fff); color: inherit; font-family: 'Poppins', sans-serif;">
                        </div>

                        <div style="display: flex; flex-direction: column; gap: 8px; text-align: left;">
                            <label for="mensaje" style="font-weight: 600; font-size: 0.95rem;" data-i18n="label_message">Mensaje</label>
                            <textarea id="mensaje" name="mensaje" rows="5" placeholder="Escribe tu mensaje aquí..." required style="padding: 12px 16px; border-radius: 8px; border: 1px solid var(--border-color, #ccc); background: var(--bg-input, #fff); color: inherit; font-family: 'Poppins', sans-serif; resize: vertical;"></textarea>
                        </div>

                        <button type="submit" class="btn-promo" style="margin-top: 10px; cursor: pointer; border: none; font-size: 1rem; font-weight: 600;" data-i18n="btn_submit">Enviar mensaje</button>
                    </form>
                </div>
            </div>
        </section>
    </div>

    <!-- Scripts de Interacción -->
    <script>
        const translations = {
            es: {
                nav_discover: "Descubrir",
                nav_hotels: "Hoteles",
                nav_foros: "Foros",
                nav_contact: "Contacto",
                nav_signin: "Iniciar sesión",
                contact_hero: "Ponte en contacto con nosotros",
                contact_title: "¿Tienes alguna duda o sugerencia?",
                contact_subtitle: "Completa el siguiente formulario y nuestro equipo de soporte o guías turísticos locales te responderá a la brevedad posible.",
                label_name: "Nombre completo",
                label_email: "Correo electrónico",
                label_subject: "Asunto",
                label_message: "Mensaje",
                btn_submit: "Enviar mensaje"
            },
            en: {
                nav_discover: "Discover",
                nav_hotels: "Hotels",
                nav_foros: "Forums",
                nav_contact: "Contact",
                nav_signin: "Sign in",
                contact_hero: "Get in touch with us",
                contact_title: "Do you have any questions or suggestions?",
                contact_subtitle: "Fill out the form below and our support team or local tour guides will get back to you as soon as possible.",
                label_name: "Full name",
                label_email: "Email address",
                label_subject: "Subject",
                label_message: "Message",
                btn_submit: "Send message"
            }
        };

        const langToggleBtn = document.getElementById('lang-toggle');
        const langText = document.getElementById('lang-text');
        const pageContent = document.getElementById('pageContent');

        function setLanguage(lang) {
            pageContent.classList.add('fade-out');

            setTimeout(() => {
                document.documentElement.setAttribute('lang', lang);
                localStorage.setItem('gonic-lang', lang);

                document.querySelectorAll('[data-i18n]').forEach(el => {
                    const key = el.getAttribute('data-i18n');
                    if (translations[lang] && translations[lang][key]) {
                        el.textContent = translations[lang][key];
                    }
                });

                if (langText) {
                    langText.textContent = lang === 'es' ? 'EN' : 'ES';
                }

                pageContent.classList.remove('fade-out');
            }, 350);
        }

        const savedLang = localStorage.getItem('gonic-lang') || 'es';
        setLanguage(savedLang);

        if (langToggleBtn) {
            langToggleBtn.addEventListener('click', () => {
                const currentLang = document.documentElement.getAttribute('lang') || 'es';
                setLanguage(currentLang === 'es' ? 'en' : 'es');
            });
        }

        // Cambio de Tema (Claro / Oscuro)
        const toggleBtn = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const themeText = document.getElementById('theme-text');

        const moonSVG = `
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>`;

        const sunSVG = `
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="5"/>
                <line x1="12" y1="1" x2="12" y2="3"/>
                <line x1="12" y1="21" x2="12" y2="23"/>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                <line x1="1" y1="12" x2="3" y2="12"/>
                <line x1="21" y1="12" x2="23" y2="12"/>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
            </svg>`;

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('gonic-theme', theme);

            if (theme === 'dark') {
                themeIcon.innerHTML = sunSVG;
                themeText.textContent = 'Claro';
            } else {
                themeIcon.innerHTML = moonSVG;
                themeText.textContent = 'Oscuro';
            }
        }

        const savedTheme = localStorage.getItem('gonic-theme') || 'light';
        applyTheme(savedTheme);

        toggleBtn.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
            const nextTheme = currentTheme === 'light' ? 'dark' : 'light';
            applyTheme(nextTheme);
        });
    </script>

</body>
</html>
