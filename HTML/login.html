<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go Nic - Iniciar Sesión</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/styles.css">
    <link rel="stylesheet" href="../CSS/login.css">
</head>
<body class="login-body">

    <div class="split-screen">
        <!-- PANEL IZQUIERDO: FORMULARIO -->
        <main class="panel-form">
            <!-- Header superior centrado -->
            <div class="form-header">
                <p>¿Necesitas una cuenta? <a href="register.html" class="link-highlight">Regístrate</a></p>
            </div>

            <!-- Contenido principal centrado -->
            <div class="form-container">
                <!-- Logo Oficial LH.png Centrado -->
                <div class="brand-badge">
                    <img src="../ASSETS/pajarito.png" alt="Go Nic Logo" class="brand-logo-img">
                </div>

                <h2>Iniciar sesión en Go Nic</h2>

                <form onsubmit="return false;">
                    <div class="field-group">
                        <label for="email">Correo electrónico <span class="asterisk">*</span></label>
                        <input type="email" id="email" placeholder="usuario@gmail.com" required>
                    </div>

                    <div class="field-group">
                        <label for="password">Contraseña <span class="asterisk">*</span></label>
                        <div class="input-password-wrapper">
                            <input type="password" id="password" placeholder="••••••••••••" required>
                            <button type="button" class="btn-toggle-show">MOSTRAR</button>
                        </div>
                    </div>

                    <div class="form-actions">
                        <a href="#" class="link-subtle">¿Olvidaste tu contraseña?</a>
                    </div>

                    <button type="submit" class="btn-login-pill">Iniciar sesión</button>
                </form>
            </div>

            <!-- Footer inferior -->
            <footer class="form-footer">
                <a href="#">Ayuda</a>
                <a href="#">Términos</a>
                <a href="#">Privacidad</a>
                <a href="#">Configuración de cookies</a>
            </footer>
        </main>

        <!-- PANEL DERECHO: BANNER VISUAL -->
        <aside class="panel-banner">
            <div class="banner-content">
                <h1 class="banner-logo">GO <span>NIC</span></h1>
                <p class="banner-tagline">Tierra de lagos y volcanes.</p>
            </div>
        </aside>
    </div>

</body>
</html>
